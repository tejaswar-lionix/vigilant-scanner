[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "vigilant-scanner"
version = "1.0.0"
description = "Vigilant Scanner - Secret & Compliance Security Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = ["fastapi","uvicorn","pydantic","click","pyyaml","rich","gitpython","requests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vigilant --cov-report=term"
